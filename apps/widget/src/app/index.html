<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Assistant</title>
    <!--
      The iframe sets its own CSP. It is served from our origin, so this constrains only our
      code — the merchant's page is unaffected. `frame-ancestors` is intentionally permissive
      here because any merchant site may embed us; the real authorisation is the server-side
      origin allowlist checked when the session is created, which a CSP cannot express
      per-tenant.

      The policy itself is built in `vite.app.config.ts` from the same API origin the code is
      compiled against, so the two can never disagree.
    -->
    <meta http-equiv="Content-Security-Policy" content="%CSP%" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
