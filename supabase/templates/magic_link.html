<!doctype html>
<html lang="en">
  <body style="margin:0;background:#fff9f2;color:#2d241e;font-family:Arial,Helvetica,sans-serif;">
    <div style="padding:32px 16px;background:#fff9f2;background-image:radial-gradient(circle at 12% 0%,rgba(239,107,46,.14),transparent 34%),radial-gradient(circle at 88% 100%,rgba(45,36,30,.07),transparent 42%);">
      <div style="max-width:560px;margin:0 auto;background:#fffdf9;border:1px solid rgba(92,69,50,.16);border-radius:18px;padding:36px 32px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0">
          <tr>
            <td style="padding-right:9px;vertical-align:middle;"><img src="https://atlowest.in/voomate-logo.png" alt="Voomate" width="30" height="25" style="display:block;border:0;" /></td>
            <td style="vertical-align:middle;"><img src="https://atlowest.in/voomate-text-logo.png" alt="Voomate" width="116" height="22" style="display:block;border:0;" /></td>
          </tr>
        </table>
        <p style="margin:30px 0 8px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#ef6b2e;font-weight:700;">Secure access</p>
        <h1 style="margin:0 0 20px;font-size:30px;line-height:1.08;letter-spacing:-.04em;color:#2d241e;">Your sign-in code</h1>
        <p style="margin:0 0 22px;font-size:16px;line-height:1.55;color:#6e5d50;">Use the code below to continue to Voomate.</p>
        <p style="margin:0 0 22px;font-size:34px;line-height:1;font-weight:800;letter-spacing:.2em;color:#000;">{{ .Token }}</p>
        <p style="margin:0 0 18px;font-size:15px;line-height:1.5;font-weight:800;color:#000;">Enter this one-time code to securely access your Voomate workspace.</p>
        <p style="margin:0;font-size:13px;line-height:1.5;color:#9b897b;">This code expires in 10 minutes and can be used once.</p>
      </div>
      <p style="max-width:560px;margin:18px auto 0;text-align:center;font-size:12px;line-height:1.5;color:#6e5d50;">If you did not request this code, you can safely ignore this message.</p>
    </div>
  </body>
</html>
