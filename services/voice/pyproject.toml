[project]
name = "voomate-voice"
version = "0.1.0"
description = "AWS-native Pipecat voice edge for the Voomate Web Agent"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx>=0.27,<1",
  "pipecat-ai[aws,runner,silero,webrtc]>=0.0.105,<1",
  "pyjwt>=2.9,<3",
]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

