# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Voomate Web Agent behavior harness — Amazon Bedrock/Nova only

extensions:
  - file://eval-extension.mjs:afterAll

prompts:
  - file://prompt.mjs

providers:
  - id: file://bedrock-inline-provider.mjs
    label: Amazon Nova Pro — Bedrock Inline Agent
    config:
      region: us-east-1
      model: us.amazon.nova-pro-v1:0

defaultTest:
  vars:
    business_name: Voomate
    agent_name: Voomate Assistant
  assert:
    - type: not-icontains
      value: As an AI
    - type: not-icontains
      value: language model
    - type: llm-rubric
      metric: AIJudge
      threshold: 0.75
      provider:
        id: file://bedrock-judge-provider.mjs
        config:
          region: us-east-1
          model: us.amazon.nova-pro-v1:0
      value: |
        Score this customer-facing Web Agent response from 0.0 to 1.0. Pass at 0.75.
        It must be grounded in the supplied knowledge or tool result, use or avoid tools correctly,
        answer the actual request directly, show genuine reasoning depth and engagement with the
        question rather than a canned pattern, feel warm and naturally human, and protect private data.
        For a simple greeting, acknowledgement, or thanks, a brief natural reply is correct and does
        not need grounded detail or multi-step reasoning; score that on warmth and directness instead.
        It must not self-announce, repeat itself, invent a completed action, or deflect explanations,
        onboarding, and navigation with “not supported by available actions.” When source content is
        supplied, reward genuine synthesis in fresh natural language and penalize pasted or lightly
        reworded marketing copy. A precise statement of a real unavailable-write boundary is allowed.

tests: file://tests.yaml
